name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Generate module metadata
        run: go mod tidy

      - name: Commit module metadata
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- go.mod go.sum; then
            echo "Module metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "chore: commit module metadata"
          git push origin "HEAD:${BRANCH}"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: >-
          go build -trimpath
          -ldflags="-s -w
          -X github.com/fijimunkii/chatgpt-plugin-tailscale/internal/version.Version=ci
          -X github.com/fijimunkii/chatgpt-plugin-tailscale/internal/version.Commit=${GITHUB_SHA}
          -X github.com/fijimunkii/chatgpt-plugin-tailscale/internal/version.BuildDate=ci"
          ./cmd/gateway

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build image
        run: >-
          docker build
          --build-arg VERSION=ci
          --build-arg COMMIT=${GITHUB_SHA}
          --build-arg BUILD_DATE=ci
          --tag chatgpt-plugin-tailscale:ci
          .
